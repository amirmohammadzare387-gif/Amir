<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت وبلاگ</title>
    
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.ckeditor.com/4.22.1/full/ckeditor.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #f0f2f5;
            color: #333;
        }

        .lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #1e293b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .lock-screen.hidden {
            display: none;
        }

        .lock-box {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
        }

        .lock-box .icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .lock-box h2 {
            color: #1e293b;
            margin-bottom: 30px;
            font-size: 1.4rem;
        }

        .lock-box input {
            width: 100%;
            padding: 14px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 8px;
            direction: ltr;
            margin-bottom: 20px;
        }

        .lock-box input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }

        .lock-box .btn-unlock {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .lock-box .btn-unlock:active {
            background: #1d4ed8;
            transform: scale(0.98);
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.9rem;
            margin-top: 15px;
            display: none;
            font-weight: 500;
        }

        .main-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .panel-header {
            background: linear-gradient(135deg, #1e293b, #334155);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .panel-header h1 {
            font-size: 1.5rem;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-outline {
            background: transparent;
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-change-pass {
            background: #f59e0b;
            color: white;
        }

        .editor-section {
            padding: 25px;
            border-bottom: 1px solid #e2e8f0;
        }

        .editor-section h2 {
            margin-bottom: 20px;
            color: #1e293b;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #475569;
        }

        .form-group input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.95rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .editor-toolbar-custom {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            flex-wrap: wrap;
        }

        .editor-toolbar-custom span {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 500;
        }

        .btn-upload {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 8px 16px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 6px;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .btn-upload:active {
            background: #4f46e5;
            transform: scale(0.97);
        }

        .btn-upload input[type="file"] {
            display: none;
        }

        .upload-msg {
            font-size: 0.8rem;
            color: #10b981;
            font-weight: 500;
        }

        .hint-text {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-right: auto;
        }

        .btn-submit {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-submit:active {
            background: #1d4ed8;
            transform: scale(0.98);
        }

        .posts-section {
            padding: 25px;
        }

        .posts-section h2 {
            margin-bottom: 20px;
            color: #1e293b;
            border-bottom: 3px solid #3b82f6;
            padding-bottom: 10px;
        }

        .post-card {
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-right: 5px solid #3b82f6;
            position: relative;
        }

        .post-card h3 {
            color: #1e293b;
            margin-bottom: 10px;
        }

        .post-meta {
            color: #94a3b8;
            font-size: 0.8rem;
            margin-bottom: 15px;
        }

        .post-content {
            color: #475569;
            line-height: 1.9;
            text-align: justify;
        }

        .post-content img {
            max-width: 100%;
            border-radius: 8px;
            margin: 15px 0;
        }

        .delete-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #fee2e2;
            color: #ef4444;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #94a3b8;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: white;
            padding: 30px 25px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .modal-box h3 {
            margin-bottom: 20px;
            color: #1e293b;
        }

        .modal-box input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.95rem;
            margin-bottom: 12px;
            text-align: center;
            direction: ltr;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .modal-buttons .btn {
            flex: 1;
        }

        .btn-save {
            background: #10b981;
            color: white;
        }

        .btn-cancel {
            background: #94a3b8;
            color: white;
        }

        .modal-msg {
            font-size: 0.85rem;
            margin-top: 5px;
            min-height: 20px;
        }

        @media (max-width: 600px) {
            .panel-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .editor-section, .posts-section {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="lock-screen" id="lockScreen">
        <div class="lock-box">
            <div class="icon">🔐</div>
            <h2>ورود به پنل مدیریت</h2>
            <input type="password" id="passwordInput" placeholder="رمز عبور را وارد کنید" maxlength="20" autocomplete="off">
            <button class="btn-unlock" onclick="checkPassword()">🔓 ورود به پنل</button>
            <p class="error-msg" id="errorMsg">⛔ رمز عبور اشتباه است!</p>
        </div>
    </div>

    <div class="modal-overlay" id="changePassModal">
        <div class="modal-box">
            <h3>🔑 تغییر رمز عبور</h3>
            <input type="password" id="currentPassInput" placeholder="رمز فعلی">
            <input type="password" id="newPassInput" placeholder="رمز جدید (حداقل ۴ کاراکتر)">
            <input type="password" id="confirmPassInput" placeholder="تکرار رمز جدید">
            <p class="modal-msg" id="modalMsg"></p>
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeChangePassModal()">انصراف</button>
                <button class="btn btn-save" onclick="changePassword()">💾 ذخیره</button>
            </div>
        </div>
    </div>

    <div class="main-container">
        
        <div class="panel-header">
            <h1>📝 پنل مدیریت وبلاگ</h1>
            <div class="header-buttons">
                <button class="btn btn-outline" onclick="toggleEditor()">✍️ ویرایشگر</button>
                <button class="btn btn-change-pass" onclick="openChangePassModal()">🔑 تغییر رمز</button>
                <button class="btn btn-danger" onclick="logout()">🚪 خروج</button>
            </div>
        </div>

        <div class="editor-section" id="editorSection">
            <h2>📄 نوشتن مقاله جدید</h2>
            <div class="form-group">
                <label>عنوان مقاله:</label>
                <input type="text" id="postTitle" placeholder="عنوان مقاله را اینجا بنویسید...">
            </div>
            <div class="form-group">
                <label>دسته‌بندی:</label>
                <input type="text" id="postCategory" placeholder="مثلاً: برنامه‌نویسی، کتاب، آموزش...">
            </div>

            <div class="form-group">
                <label>📝 متن مقاله:</label>
                
                <div class="editor-toolbar-custom">
                    <span>🖼️</span>
                    <label class="btn-upload">
                        📁 افزودن عکس
                        <input type="file" id="imageUpload" accept="image/*" onchange="insertImageAtCursor(event)">
                    </label>
                    <span class="upload-msg" id="uploadMsg"></span>
                    <span class="hint-text">💡 برای حذف عکس: روی عکس بزن → ❌ رو بزن</span>
                </div>
                
                <textarea name="editor" id="editor"></textarea>
            </div>
            
            <button class="btn-submit" onclick="publishPost()">📌 انتشار مقاله</button>
        </div>

        <div class="posts-section">
            <h2>📚 مقالات منتشر شده</h2>
            <div id="postsContainer">
                <div class="empty-state">
                    <p>هنوز مقاله‌ای منتشر نشده ✨</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        const DEFAULT_PASSWORD = '123456';
        
        if (!localStorage.getItem('adminPassword')) {
            localStorage.setItem('adminPassword', DEFAULT_PASSWORD);
        }
        
        let currentPassword = localStorage.getItem('adminPassword');
        let posts = JSON.parse(localStorage.getItem('blogPosts')) || [];

        CKEDITOR.replace('editor', {
            language: 'fa',
            height: 400,
            contentsLangDirection: 'rtl',
            toolbar: [
                { name: 'clipboard', items: ['Undo', 'Redo'] },
                { name: 'styles', items: ['Format', 'Font', 'FontSize'] },
                { name: 'basicstyles', items: ['Bold', 'Italic', 'Underline', 'Strike'] },
                { name: 'colors', items: ['TextColor', 'BGColor'] },
                { name: 'align', items: ['JustifyLeft', 'JustifyCenter', 'JustifyRight', 'JustifyBlock'] },
                { name: 'paragraph', items: ['NumberedList', 'BulletedList', '-', 'Blockquote'] },
                { name: 'insert', items: ['Table', 'HorizontalRule'] },
                { name: 'tools', items: ['Maximize', 'Source'] }
            ],
            on: {
                instanceReady: function() {
                    addDeleteButtonsToImages();
                },
                change: function() {
                    addDeleteButtonsToImages();
                }
            }
        });

        function addDeleteButtonsToImages() {
            setTimeout(() => {
                const editorDoc = CKEDITOR.instances.editor.document.$;
                const images = editorDoc.querySelectorAll('img');
                
                images.forEach(img => {
                    if (img.closest('.cke_editable') && !img.dataset.hasDeleteBtn) {
                        img.dataset.hasDeleteBtn = 'true';
                        img.style.cursor = 'pointer';
                        
                        img.addEventListener('click', function(e) {
                            e.stopPropagation();
                            
                            editorDoc.querySelectorAll('img.active-delete').forEach(el => {
                                el.classList.remove('active-delete');
                                const oldBadge = el.parentElement?.querySelector('.delete-badge');
                                if (oldBadge) oldBadge.remove();
                            });
                            
                            this.classList.add('active-delete');
                            
                            const badge = document.createElement('span');
                            badge.className = 'delete-badge';
                            badge.innerHTML = '❌';
                            badge.style.cssText = `
                                position: absolute;
                                top: -8px;
                                right: -8px;
                                background: #ef4444;
                                color: white;
                                width: 26px;
                                height: 26px;
                                border-radius: 50%;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                font-size: 13px;
                                cursor: pointer;
                                z-index: 999;
                                box-shadow: 0 2px 8px rgba(0,0,0,0.3);
                                animation: popIn 0.2s ease;
                            `;
                            
                            if (this.parentElement) {
                                this.parentElement.style.position = 'relative';
                                this.parentElement.appendChild(badge);
                            }
                            
                            badge.addEventListener('click', function(e2) {
                                e2.stopPropagation();
                                img.remove();
                                badge.remove();
                            });
                            
                            const removeBadge = function(e3) {
                                if (!img.contains(e3.target) && e3.target !== badge) {
                                    img.classList.remove('active-delete');
                                    badge.remove();
                                    document.removeEventListener('click', removeBadge);
                                }
                            };
                            
                            setTimeout(() => {
                                document.addEventListener('click', removeBadge);
                            }, 100);
                        });
                    }
                });
            }, 300);
        }

        function checkPassword() {
            const input = document.getElementById('passwordInput');
            const errorMsg = document.getElementById('errorMsg');
            const enteredPass = input.value.trim();
            
            if (enteredPass === currentPassword) {
                sessionStorage.setItem('isUnlocked', 'true');
                document.getElementById('lockScreen').classList.add('hidden');
                errorMsg.style.display = 'none';
                input.value = '';
                renderPosts();
            } else {
                errorMsg.style.display = 'block';
                input.value = '';
                input.focus();
            }
        }
        
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });

        function logout() {
            if (confirm('آیا مطمئن هستید که می‌خواهید خارج شوید؟')) {
                sessionStorage.removeItem('isUnlocked');
                document.getElementById('lockScreen').classList.remove('hidden');
                document.getElementById('passwordInput').focus();
            }
        }

        function openChangePassModal() {
            document.getElementById('changePassModal').classList.add('active');
            document.getElementById('currentPassInput').value = '';
            document.getElementById('newPassInput').value = '';
            document.getElementById('confirmPassInput').value = '';
            document.getElementById('modalMsg').textContent = '';
        }

        function closeChangePassModal() {
            document.getElementById('changePassModal').classList.remove('active');
        }

        function changePassword() {
            const currentPass = document.getElementById('currentPassInput').value.trim();
            const newPass = document.getElementById('newPassInput').value.trim();
            const confirmPass = document.getElementById('confirmPassInput').value.trim();
            const msg = document.getElementById('modalMsg');
            
            if (currentPass !== currentPassword) {
                msg.textContent = '⛔ رمز فعلی اشتباه است!';
                msg.style.color = '#ef4444';
                return;
            }
            if (newPass.length < 4) {
                msg.textContent = '⛔ رمز جدید باید حداقل ۴ کاراکتر باشد!';
                msg.style.color = '#ef4444';
                return;
            }
            if (newPass !== confirmPass) {
                msg.textContent = '⛔ تکرار رمز جدید مطابقت ندارد!';
                msg.style.color = '#ef4444';
                return;
            }
            
            currentPassword = newPass;
            localStorage.setItem('adminPassword', newPass);
            msg.textContent = '✅ رمز عبور با موفقیت تغییر کرد!';
            msg.style.color = '#10b981';
            
            setTimeout(() => closeChangePassModal(), 1500);
        }

        document.getElementById('changePassModal').addEventListener('click', function(e) {
            if (e.target === this) closeChangePassModal();
        });

        function insertImageAtCursor(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const allowedTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
            if (!allowedTypes.includes(file.type)) {
                alert('⛔ فقط JPG، PNG، GIF، WebP مجاز است!');
                event.target.value = '';
                return;
            }
            
            if (file.size > 10 * 1024 * 1024) {
                alert('⛔ حجم فایل نباید بیشتر از ۱۰ مگابایت باشد!');
                event.target.value = '';
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const editor = CKEDITOR.instances.editor;
                
                const imgElement = editor.document.createElement('img');
                imgElement.setAttribute('src', e.target.result);
                imgElement.setAttribute('style', 'max-width:100%; border-radius:8px; margin:10px 0;');
                editor.insertElement(imgElement);
                
                const msgEl = document.getElementById('uploadMsg');
                msgEl.textContent = '✅ عکس اضافه شد';
                setTimeout(() => { msgEl.textContent = ''; }, 2000);
                
                editor.focus();
                addDeleteButtonsToImages();
            };
            reader.readAsDataURL(file);
            
            event.target.value = '';
        }

        function publishPost() {
            const title = document.getElementById('postTitle').value.trim();
            const category = document.getElementById('postCategory').value.trim();
            const content = CKEDITOR.instances.editor.getData().trim();

            if (!title) { alert('لطفاً عنوان مقاله را وارد کنید.'); return; }
            if (!content) { alert('لطفاً متن مقاله را بنویسید.'); return; }

            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', calendar: 'persian' };
            const dateStr = now.toLocaleDateString('fa-IR', options);

            const post = {
                id: Date.now(),
                title: title,
                category: category || 'عمومی',
                content: content,
                date: dateStr
            };

            posts.unshift(post);
            localStorage.setItem('blogPosts', JSON.stringify(posts));

            document.getElementById('postTitle').value = '';
            document.getElementById('postCategory').value = '';
            CKEDITOR.instances.editor.setData('');
            document.getElementById('uploadMsg').textContent = '';

            renderPosts();
            document.getElementById('postsContainer').scrollIntoView({ behavior: 'smooth' });
        }

        function deletePost(postId) {
            if (confirm('آیا از حذف این مقاله مطمئن هستید؟')) {
                posts = posts.filter(post => post.id !== postId);
                localStorage.setItem('blogPosts', JSON.stringify(posts));
                renderPosts();
            }
        }

        function renderPosts() {
            const container = document.getElementById('postsContainer');
            
            if (posts.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>هنوز مقاله‌ای منتشر نشده ✨</p></div>';
                return;
            }

            container.innerHTML = posts.map(post => `
                <div class="post-card">
                    <button class="delete-btn" onclick="deletePost(${post.id})">🗑️ حذف</button>
                    <h3>${post.title}</h3>
                    <div class="post-meta">📅 ${post.date} | 🏷️ ${post.category}</div>
                    <div class="post-content">${post.content}</div>
                </div>
            `).join('');
        }

        function toggleEditor() {
            const editorSection = document.getElementById('editorSection');
            editorSection.style.display = editorSection.style.display === 'none' ? 'block' : 'none';
        }

        const style = document.createElement('style');
        style.textContent = `
            @keyframes popIn {
                from { transform: scale(0); }
                to { transform: scale(1); }
            }
        `;
        document.head.appendChild(style);

        window.onload = function() {
            const isUnlocked = sessionStorage.getItem('isUnlocked') === 'true';
            if (isUnlocked) {
                document.getElementById('lockScreen').classList.add('hidden');
            } else {
                document.getElementById('passwordInput').focus();
            }
            renderPosts();
        };
    </script>

</body>
</html>
